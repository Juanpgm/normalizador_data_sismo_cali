name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No credentials here on purpose: the pipeline fixtures skip cleanly when
      # data is unavailable, so the unit tests still run on forks and PRs.
      - name: Run tests
        run: pytest -q

      - name: Notebooks must not carry outputs (they contain personal data)
        run: python scripts/strip_notebooks.py --check
